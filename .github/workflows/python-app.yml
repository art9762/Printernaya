name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 .
        
    - name: Lint with flake8
      run: |
        python -m flake8 cli.py core bots friendgpt tests setup.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test synthetic import workflow
      run: python -m unittest discover -s tests -v

    - name: Build and test installed wheel
      run: |
        python -m pip wheel --no-deps . --wheel-dir wheelhouse
        python tests/check_wheel.py wheelhouse/friendgpt-0.1.0-py3-none-any.whl
